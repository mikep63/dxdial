name: Refresh FCC data

# The FCC rebuilds LMS nightly. This reads it weekly, because a licence is a
# slow thing: a station that appears on a Tuesday is still there on the Sunday,
# and the daily run was mostly spending a commit to say nothing had changed.
# Weekly also batches the change log into something worth reading rather than a
# trickle of one-line days.
#
# Sunday, and not just any day. 09:40 UTC is 04:40 US Eastern in winter and
# 05:40 in summer -- the same morning, not the evening before -- so a Thursday
# run would land inside the LMS maintenance window that closes at 08:00 Eastern
# on Thursday. The daily schedule hit that once a week and leaned on verify.py
# to catch what came back. Choosing the day removes the problem instead.
#
# This runs in Actions rather than on a laptop because the commit it makes is
# the only push in this project that does not go through GitHub Desktop -- the
# runner has a token, so the refresh needs nobody to be awake. Run it by hand
# from the Actions tab whenever a week is too long to wait.
on:
  schedule:
    - cron: '40 9 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the current FCC records
        run: python3 update_data.py

      - name: Rebuild docs/
        run: python3 build_site.py

      # The gate. A failed or partial download reaches this as a table that is
      # short, misplaced or off the channel grid, and stopping here leaves the
      # previous build serving rather than publishing the damage.
      - name: Verify before publishing
        run: python3 verify.py

      - name: Commit whatever changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          # Most nights nothing moves. An empty commit every day would bury
          # the real changes, so this stops rather than committing nothing.
          if git diff --cached --quiet; then
            echo "No change in the FCC data today."
            exit 0
          fi
          # The station count makes the log readable at a glance: a day where
          # it swings by hundreds is a bad fetch, not a real change.
          COUNT=$(python3 -c "import json;print(json.load(open('docs/data/meta.json'))['stations'])")
          git commit -m "Refresh FCC data — ${COUNT} stations on air"
          git push
